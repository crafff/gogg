# Local development config shared by gogg-api and gogg-worker.
# Copy to config/dev.yaml for plaintext local use, or mirror this
# structure in deploy/secrets/dev.enc.yaml for SOPS-managed secrets.

api:
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_grace: 15s
  allowed_origins:
    - http://localhost:5173
    - http://localhost:3000
  graphql_playground: true

assets:
  root: "data/game-assets"

temporal:
  host_port: localhost:7233
  namespace: default
  task_queues:
    - crawl-kr
    - crawl-na1
  region_task_queues:
    KR: crawl-kr
    NA1: crawl-na1

summoner:
  freshness: 5m
  ip_limit: 5
  ip_limit_window: 10m

database:
  dsn: postgres://gogg:goggpass@localhost:55433/gogg?sslmode=disable
  max_open_conns: 10
  min_idle_conns: 2
  max_idle_conns: 2
  conn_max_lifetime: 5m
  conn_max_lifetime_seconds: 300

redis:
  url: redis://localhost:6379/0

logging:
  level: info
  format: json

auth:
  # Browser Google login does not need JWT. Leave blank unless a non-browser
  # Bearer client is enabled; then use at least 32 random bytes.
  jwt_secret: ""
  issuer: gogg.local
  access_ttl: 15m
  refresh_ttl: 720h
  cookie_domain: ""
  cookie_secure: false

oauth:
  discord:
    client_id: ""
    client_secret: ""
    redirect_url: ""
  google:
    client_id: ""
    client_secret: ""
    # When enabled, register and use this exact local URI:
    # http://localhost:5173/oauth/callback/google
    redirect_url: ""

riot:
  api_key: YOUR_API_KEY
  base_url: https://kr.api.riotgames.com

crawler_lite:
  outage_initial_interval: 1s
  outage_max_interval: 2m
  outage_jitter: 0.2

raw_archive:
  enabled: false
  root: "data/riot-raw"
  compression_level: 6

tft:
  # One global workflow fans out across all current TFT platform routes.
  # Both crawl and static schedules are always created paused; use crawlctl
  # after deploying the worker and checking the task-queue pollers.
  platforms: [NA1, BR1, LA1, LA2, KR, JP1, EUN1, EUW1, TR1, ME1, RU, OC1, SG2, TW2, VN2]
  crawl_cron: "17 */3 * * *"
  static_cron: "7 */6 * * *"
  profile_name: global_high_tier
  match_count_per_seed: 20
  master_limit: 500
  diamond_per_division: 50
  scale_master_limit: 1000
  scale_diamond_per_division: 100
  scale_after: 48h
  scale_below_observations: 10000
  window: 168h
  window_lag: 30m
  overlap: 6h
  static_root: data/game-assets
  static_locales: [en_us, zh_cn]
  static_download_batch: 128
  static_download_workers: 16
  player_freshness: 10m
  player_ip_limit: 5
  player_ip_limit_window: 10m

regions:
  - name: KR
    base_url: https://kr.api.riotgames.com
  - name: NA1
    base_url: https://na1.api.riotgames.com

run_profiles:
  daily_kr:
    region: KR
    mode: incremental
    target_tiers: [CHALLENGER, GRANDMASTER, MASTER]
    rank_prefetch_tiers: [CHALLENGER, GRANDMASTER, MASTER, DIAMOND]
    queue: RANKED_SOLO_5x5
    execution: pipeline

  daily_na:
    region: NA1
    mode: incremental
    target_tiers: [CHALLENGER, GRANDMASTER, MASTER]
    rank_prefetch_tiers: [CHALLENGER, GRANDMASTER, MASTER, DIAMOND]
    queue: RANKED_SOLO_5x5
    execution: pipeline

  diamond_weekly_kr:
    region: KR
    mode: incremental
    target_tiers: [CHALLENGER, GRANDMASTER, MASTER, DIAMOND]
    rank_prefetch_tiers: [CHALLENGER, GRANDMASTER, MASTER, DIAMOND, EMERALD]
    queue: RANKED_SOLO_5x5
    execution: pipeline

schedule:
  - cron: "0 4 * * *"
    profile: daily_kr
  - cron: "0 4 * * *"
    profile: daily_na
  - cron: "0 3 * * 1"
    profile: diamond_weekly_kr
