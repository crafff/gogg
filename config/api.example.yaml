api:
  port: 8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_grace: 15s
  allowed_origins:
    - http://localhost:5173
    - http://localhost:3000
  graphql_playground: true

assets:
  root: "data/game-assets"

database:
  dsn: postgres://gogg:goggpass@localhost:55433/gogg?sslmode=disable
  max_open_conns: 10
  min_idle_conns: 2
  conn_max_lifetime: 5m

redis:
  url: redis://localhost:6379/0

tft:
  player_freshness: 10m
  player_ip_limit: 5
  player_ip_limit_window: 10m

logging:
  level: info
  format: json

auth:
  # Optional non-browser Bearer JWT secret; at least 32 random bytes if set.
  jwt_secret: ""
  issuer: gogg.local
  access_ttl: 15m
  refresh_ttl: 720h
  cookie_domain: ""
  cookie_secure: false

oauth:
  discord:
    client_id: ""
    client_secret: ""
    redirect_url: ""
  google:
    client_id: ""
    client_secret: ""
    # Local example: http://localhost:5173/oauth/callback/google
    # Production must use the exact HTTPS URI registered in Google Cloud.
    redirect_url: ""
