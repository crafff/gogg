query TFTAnalysisCatalog {
  tftAnalysisCatalog {
    platform
    patch
    setNumber
    queueId
    cohort
    window
    publishedAt
    sourceMatches
    sourceParticipants
    coverage {
      windowStart
      windowEnd
      exactLineups
      familyThreshold
    }
  }
}

query TFTLineups($filter: TFTLineupsFilter!) {
  tftLineups(filter: $filter) {
    platform
    patch
    setNumber
    queueId
    cohort
    window
    locale
    algorithmVersion
    publishedAt
    sourceMatches
    sourceParticipants
    coverage {
      windowStart
      windowEnd
      exactLineups
      familyThreshold
    }
    items {
      id
      coreUnits { id name iconUrl }
      commonItems { entity { id name iconUrl } count rate }
      commonAugments { entity { id name iconUrl } count rate }
      commonTraits { entity { id name iconUrl } count rate }
      unitItems {
        unit { id name iconUrl }
        commonItems { entity { id name iconUrl } count rate }
        isCore
        coreRank
        averageItems
        itemInvestmentRate
        equippedRate
        threeItemRate
        knownStarSamples
        unknownStarSamples
        starCoverage
        starDistribution {
          stars
          sampleSize
          rate
          knownRate
          avgPlacement
          firstRate
          top4Rate
        }
      }
      starLevels {
        totalStars
        sampleSize
        lobbyCount
        rate
        avgPlacement
        firstRate
        top4Rate
      }
      starCompositionKnownSamples
      starCompositionUnknownSamples
      starCompositionCoverage
      starCompositions {
        levels { stars unitCount }
        totalStars
        sampleSize
        rate
        avgPlacement
        firstRate
        top4Rate
      }
      metrics {
        sampleSize
        lobbyCount
        pickRate
        avgPlacement
        firstRate
        top4Rate
        contestedRate
      }
    }
  }
}

