        itemInvestmentRate
        equippedRate
        threeItemRate
        knownStarSamples
        unknownStarSamples
        starCoverage
        starDistribution {
          stars
          sampleSize
          rate
          knownRate
          avgPlacement
          firstRate
          top4Rate
        }
      }
      starLevels {
        totalStars
        sampleSize
        lobbyCount
        rate
        avgPlacement
        firstRate
        top4Rate
      }
      starCompositionKnownSamples
      starCompositionUnknownSamples
      starCompositionCoverage
      starCompositions {
        levels { stars unitCount }
        totalStars
        sampleSize
        rate
        avgPlacement
        firstRate
        top4Rate
