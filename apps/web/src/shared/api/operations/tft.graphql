}

query TFTMatchHistory($input: TFTHistoryInput!) {
  tftMatchHistory(input: $input) {
    profile {
      platform
      gameName
      tagLine
      lastRefreshedAt
      isStale
    }
    matches {
      matchId
      platform
      queueId
      patch
      gameVersion
      gameDatetime
      gameLengthSeconds
      setNumber
      tftGameType
      endOfGameResult
      participant {
        puuid
        gameName
        tagLine
        isCurrentPlayer
        placement
        level
        goldLeft
        lastRound
        playersEliminated
        totalDamageToPlayers
        augments { id name iconUrl }
        traits {
          entity { id name iconUrl }
          numUnits
          style
          tierCurrent
          tierTotal
        }
        units {
          entity { id name iconUrl }
          rarity
          tier
          items { id name iconUrl }
        }
      }
    }
    pageInfo { endCursor hasNextPage returned }
  }
}

mutation RefreshTFTPlayer($identity: TFTIdentityInput!) {
  refreshTFTPlayer(identity: $identity) {
    fresh
    reused
    job {
      id
      platform
      gameName
      tagLine
      status
      stage
      scannedCount
      fetchedCount
      failedCount
      errorCode
      createdAt
      updatedAt
      completedAt
    }
  }
}

query TFTLookupJob($id: ID!) {
  tftLookupJob(id: $id) {
    id
    platform
    gameName
    tagLine
    status
    stage
    scannedCount
    fetchedCount
    failedCount
    errorCode
    createdAt
    updatedAt
    completedAt
  }
}
