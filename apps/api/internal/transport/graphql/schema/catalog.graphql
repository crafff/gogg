# Catalog: the small read-only surface that powers filter dropdowns.

extend type Query {
  """
  Game versions with published statistics rollups, newest first. Newer raw-only
  match versions remain queryable through summoner history but are omitted here.
  """
  versions: [String!]!

  """
  Regions with published statistics rollups, alphabetically.
  V1 returns KR and NA1; more regions land as the crawler grows.
  """
  regions: [String!]!
}
