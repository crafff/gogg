enum TFTCohort { MASTER_PLUS DIAMOND }
enum TFTWindow { THREE_DAYS PATCH }

input TFTLineupsFilter {
  platform: String!
  patch: String = "latest"
  setNumber: Int!
  cohort: TFTCohort = MASTER_PLUS
  window: TFTWindow = PATCH
  locale: String = "en_us"
  minSamples: Int = 200
  limit: Int = 50
}

enum TFTObservedDataKind { OBSERVED_RUN_PREVIEW }

input TFTObservedLineupsFilter {
  platform: String = "KR"
  locale: String = "en_us"
  minSamples: Int = 20
  limit: Int = 30
}

type TFTObservedStaticSnapshot {
  source: String!
  patch: String!
  revision: String!
}

type TFTObservedLineupsResult {
  dataKind: TFTObservedDataKind!
  runId: ID!
  platform: String!
  platforms: [String!]!
  queueId: Int!
  setNumber: Int!
  patch: String
  rawGameVersions: [String!]!
  locale: String!
  algorithmVersion: String!
  catalogSnapshot: TFTObservedStaticSnapshot!
  assetSnapshot: TFTObservedStaticSnapshot
  sourceMatches: Int!
  sourceParticipants: Int!
  usableParticipants: Int!
  exactLineups: Int!
  windowStart: String!
  windowEnd: String!
  items: [TFTLineup!]!
}

type TFTAnalysisCatalogEntry {
  platform: String!
  patch: String!
  setNumber: Int!
  queueId: Int!
  cohort: TFTCohort!
  window: TFTWindow!
  publishedAt: String!
  sourceMatches: Int!
  sourceParticipants: Int!
  coverage: TFTAnalysisCoverage!
}

type TFTAnalysisCoverage {
  windowStart: String!
  windowEnd: String!
  exactLineups: Int!
  familyThreshold: Int!
}

type TFTEntity { id: String! name: String iconUrl: String }
type TFTEntityCount { entity: TFTEntity! count: Int! rate: Float! }
type TFTLineupMetrics {
  sampleSize: Int!
  lobbyCount: Int!
  pickRate: Float!
  avgPlacement: Float!
  firstRate: Float!
  top4Rate: Float!
  contestedRate: Float!
}
type TFTLineupUnitItems {
  unit: TFTEntity!
  commonItems: [TFTEntityCount!]!
  isCore: Boolean!
  coreRank: Int
  averageItems: Float!
  itemInvestmentRate: Float!
  equippedRate: Float!
  threeItemRate: Float!
  knownStarSamples: Int!
  unknownStarSamples: Int!
  starCoverage: Float!
  starDistribution: [TFTLineupUnitStarBucket!]!
}
type TFTLineupUnitStarBucket {
  stars: Int!
  sampleSize: Int!
  rate: Float!
  knownRate: Float!
  avgPlacement: Float
  firstRate: Float
  top4Rate: Float
}
type TFTLineupStarStrength {
  totalStars: Int!
  sampleSize: Int!
  lobbyCount: Int!
  rate: Float!
  avgPlacement: Float!
  firstRate: Float!
  top4Rate: Float!
}
type TFTLineupStarCount {
  stars: Int!
  unitCount: Int!
}
type TFTLineupStarComposition {
  levels: [TFTLineupStarCount!]!
  totalStars: Int!
  sampleSize: Int!
  rate: Float!
  avgPlacement: Float
  firstRate: Float
  top4Rate: Float
}
type TFTLineup {
  id: ID!
  coreUnits: [TFTEntity!]!
  commonItems: [TFTEntityCount!]!
  commonAugments: [TFTEntityCount!]!
  commonTraits: [TFTEntityCount!]!
  unitItems: [TFTLineupUnitItems!]!
  starLevels: [TFTLineupStarStrength!]!
  starCompositionKnownSamples: Int!
  starCompositionUnknownSamples: Int!
  starCompositionCoverage: Float!
  starCompositions: [TFTLineupStarComposition!]!
  metrics: TFTLineupMetrics!
}
type TFTLineupsResult {
  platform: String!
  patch: String!
  setNumber: Int!
  queueId: Int!
  cohort: TFTCohort!
  window: TFTWindow!
  locale: String!
  algorithmVersion: String!
  publishedAt: String!
  sourceMatches: Int!
  sourceParticipants: Int!
  coverage: TFTAnalysisCoverage!
  items: [TFTLineup!]!
}

extend type Query {
  tftAnalysisCatalog: [TFTAnalysisCatalogEntry!]!
  tftLineups(filter: TFTLineupsFilter!): TFTLineupsResult!
  tftObservedLineups(filter: TFTObservedLineupsFilter!): TFTObservedLineupsResult
  tftMatchHistory(input: TFTHistoryInput!): TFTHistoryResult
  tftLookupJob(id: ID!): TFTLookupJob
}

enum TFTLookupStatus { QUEUED RUNNING COMPLETED PARTIAL FAILED }
enum TFTLookupStage { QUEUED RESOLVE_ACCOUNT FETCH_MATCH_IDS FETCH_MATCHES FINALIZE }

input TFTIdentityInput {
  platform: String!
  gameName: String!
  tagLine: String!
}

input TFTHistoryInput {
  platform: String!
  gameName: String!
  tagLine: String!
  queueId: Int = 1100
  first: Int = 20
  after: String
  locale: String = "en_us"
}

type TFTPlayerProfile {
  platform: String!
  gameName: String!
  tagLine: String!
  lastRefreshedAt: String
  isStale: Boolean!
}

type TFTHistoryTrait {
  entity: TFTEntity!
  numUnits: Int!
  style: Int!
  tierCurrent: Int!
  tierTotal: Int!
}

type TFTHistoryUnit {
  entity: TFTEntity!
  rarity: Int!
  tier: Int!
  items: [TFTEntity!]!
}

type TFTHistoryParticipant {
  puuid: String!
  gameName: String!
  tagLine: String!
  isCurrentPlayer: Boolean!
  placement: Int!
  level: Int!
  goldLeft: Int!
  lastRound: Int!
  playersEliminated: Int!
  timeEliminatedSeconds: Float!
  totalDamageToPlayers: Int!
  companionContentId: String!
  companionItemId: Int!
  companionSkinId: Int!
  companionSpecies: String!
  abnormal: Boolean!
  augments: [TFTEntity!]!
  traits: [TFTHistoryTrait!]!
  units: [TFTHistoryUnit!]!
}

type TFTHistoryMatch {
  matchId: ID!
  platform: String!
  routingRegion: String!
  queueId: Int!
  gameVersion: String!
  patch: String!
  gameDatetime: String!
  gameLengthSeconds: Float!
  mapId: Int!
  tftGameType: String!
  setCoreName: String!
  setNumber: Int!
  endOfGameResult: String!
  participantCount: Int!
  eligible: Boolean!
  exclusionReason: String!
  participant: TFTHistoryParticipant!
  participants: [TFTHistoryParticipant!]!
}

type TFTMatchPageInfo {
  endCursor: String
  hasNextPage: Boolean!
  returned: Int!
}

type TFTHistoryResult {
  profile: TFTPlayerProfile!
  matches: [TFTHistoryMatch!]!
  pageInfo: TFTMatchPageInfo!
}

type TFTLookupJob {
  id: ID!
  platform: String!
  gameName: String!
  tagLine: String!
  status: TFTLookupStatus!
  stage: TFTLookupStage!
  scannedCount: Int!
  fetchedCount: Int!
  failedCount: Int!
  errorCode: String
  createdAt: String!
  updatedAt: String!
  completedAt: String
}

type TFTRefreshResult {
  fresh: Boolean!
  reused: Boolean!
  job: TFTLookupJob
}

extend type Mutation {
  refreshTFTPlayer(identity: TFTIdentityInput!): TFTRefreshResult!
}
