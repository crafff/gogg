# Local development stack.
#
# Brings up everything the new `gogg-api` and `gogg-worker` need:
#   - postgres        : application DB (port 55433 to avoid clash with host pg)
#   - redis           : cache, session, rate-limit token store
#   - temporal-pg     : Temporal's own persistence (isolated from app DB)
#   - temporal        : Temporal server (frontend on 7233)
#   - temporal-ui     : Temporal Web UI (http://localhost:8233)
#   - mailhog         : SMTP sink for password-reset / OAuth emails in dev
#
# Use this stack via `make dev`; application process config lives in
# config/dev.yaml locally or deploy/secrets/dev.enc.yaml via SOPS.

name: gogg-dev

networks:
  gogg-dev:
    driver: bridge

volumes:
  pg_data:
  temporal_pg_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:
  # ── App database ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gogg-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gogg
      POSTGRES_PASSWORD: goggpass
      POSTGRES_DB: gogg
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "55433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogg -d gogg"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gogg-dev]

  # ── Cache / session store ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gogg-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gogg-dev]

  # ── Temporal persistence (isolated from app DB) ─────────────
  temporal-pg:
    image: postgres:16-alpine
    container_name: gogg-dev-temporal-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporalpass
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gogg-dev]

  # ── Temporal server ─────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: gogg-dev-temporal
    restart: unless-stopped
    depends_on:
      temporal-pg:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporalpass
      POSTGRES_SEEDS: temporal-pg
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      # auto-setup:1.25.2 no longer ships a default dynamicconfig
      # file; mount our own so server startup doesn't crash on
      # the missing file. See deploy/compose/temporal/dynamicconfig/.
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [gogg-dev]

  # ── Temporal Web UI ─────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: gogg-dev-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8233:8080"
    networks: [gogg-dev]

  # ── Dev mail sink (used by user-system OAuth / reset flows) ─
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gogg-dev-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks: [gogg-dev]

  # Start the observability profile with `make observability`.
  api-observed:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    image: gogg-api:local
    container_name: gogg-dev-api-observed
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GOGG_DATABASE_DSN: ${PERF_API_DATABASE_DSN:-postgres://gogg:goggpass@postgres:5432/gogg?sslmode=disable}
      GOGG_REDIS_URL: redis://redis:6379/0
      GOGG_API_GRAPHQL_PLAYGROUND: "false"
      # Cold aggregate queries can exceed the production default while we
      # measure them. Keep the load-test connection alive so k6 records the
      # real latency instead of an artificial EOF at 15 seconds.
      GOGG_API_WRITE_TIMEOUT: 60s
    ports:
      - "18080:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [gogg-dev]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: gogg-dev-postgres-exporter
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: ${PERF_EXPORTER_DATABASE_DSN:-postgresql://gogg:goggpass@postgres:5432/gogg?sslmode=disable}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [gogg-dev]

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: gogg-dev-redis-exporter
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [gogg-dev]

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: gogg-dev-prometheus
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      - api-observed
      - postgres-exporter
      - redis-exporter
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [gogg-dev]

  k6:
    image: grafana/k6:0.57.0
    profiles: [performance]
    user: "${K6_UID:-1000}:${K6_GID:-1000}"
    depends_on:
      - api-observed
    environment:
      BASE_URL: http://api-observed:8080
    volumes:
      - ../../tests/performance/k6:/scripts:ro
      - ../../tmp/performance:/results
    networks: [gogg-dev]

  grafana:
    image: grafana/grafana:11.5.2
    container_name: gogg-dev-grafana
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks: [gogg-dev]
